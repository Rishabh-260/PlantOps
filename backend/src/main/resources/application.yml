server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/plantops}
    username: ${SPRING_DATASOURCE_USERNAME:plantops}
    password: ${SPRING_DATASOURCE_PASSWORD:plantops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    serialization.write-dates-as-timestamps: false
  task:
    scheduling:
      pool.size: 2
jwt:
  secret: ${JWT_SECRET:plantops-local-demo-secret-key-change-before-deployment-2026}
  expiration-ms: 86400000
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
springdoc:
  swagger-ui.path: /swagger-ui.html
