apiVersion: v1
kind: Namespace
metadata:
  name: plantops
---
apiVersion: v1
kind: Secret
metadata:
  name: plantops-secrets
  namespace: plantops
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-strong-database-password
  JWT_SECRET: replace-with-at-least-32-random-characters-before-deployment
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plantops-postgres
  namespace: plantops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: plantops
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: plantops}
            - {name: POSTGRES_USER, value: plantops}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: plantops-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U plantops -d plantops"]}, initialDelaySeconds: 5, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: plantops-postgres}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: plantops
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: plantops
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/plantops/plantops-api:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/plantops}
            - {name: SPRING_DATASOURCE_USERNAME, value: plantops}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: plantops-secrets, key: POSTGRES_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: plantops-secrets, key: JWT_SECRET}}}
            - {name: CORS_ORIGINS, value: "*"}
          readinessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 12}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: plantops
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: plantops
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/plantops/plantops-web:latest
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: plantops
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: plantops
  namespace: plantops
spec:
  to: {kind: Service, name: web}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
